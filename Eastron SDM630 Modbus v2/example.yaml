#
# registri pt un Eastron SDM630-Modbus v2 (posibil compatibil cu toate din seria SDM630)
#

esphome:
  name: modbus-smm
  friendly_name: modbus smm

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  baud_rate: 0

api:
  encryption:
    key: "***************"

ota:
  - platform: esphome
    password: "****************"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "modbus smm"
    password: "**********"

captive_portal:



uart:
  id: mod_bus
  tx_pin: 17
  rx_pin: 16
  baud_rate: 38400
  stop_bits: 1


modbus:
  id: mb
  flow_control_pin: GPIO12

modbus_controller:
  - id: emon
    address: 1
    modbus_id: mb
    update_interval: 5s


sensor:

- platform: modbus_controller
    modbus_controller_id: emon
    name: EMON L1 tensiune
    id: emon_l1_tensiune
    address: 0x0000
    register_type: read
    value_type: FP32
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    unit_of_measurement: V

